# Netlify build settings for the Scholte Estates website.
# Netlify detects Next.js and applies its official adapter automatically.
[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build (and its production-deploy credits) when a change only
  # touches documentation: docs/ and Markdown files. Exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs/' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Redirect the www host to the apex domain (one canonical address).
[[redirects]]
  from = "https://www.scholteestates.com/*"
  to = "https://scholteestates.com/:splat"
  status = 301
  force = true

# Self-hosted map tiles and label fonts (public/map): cache for a week.
[[headers]]
  for = "/map/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
